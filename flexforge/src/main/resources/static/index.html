<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FlexForge Console</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="logo">⚡</span>
        <span>FlexForge <span class="brand-sub">Console</span></span>
        <span id="appChip" class="chip"></span>
    </div>
    <div class="topbar-right">
        <a id="graphqlLink" href="/graphql/schema" target="_blank" class="ghost">GraphQL SDL</a>
        <a id="openapiLink" href="/__meta/openapi.json" target="_blank" class="ghost">OpenAPI</a>
        <span id="authBox"></span>
    </div>
</header>

<div class="layout">
    <aside class="sidebar">
        <nav>
            <a class="nav-item active" data-view="dashboard" id="navDashboard">
                <span class="ico">▦</span> Dashboard</a>
        </nav>
        <div class="sidebar-title">Data Models</div>
        <nav id="entityNav"></nav>
        <div class="sidebar-title">Automation</div>
        <nav>
            <a class="nav-item" data-view="flows" id="navFlows"><span class="ico">⚙</span> Flows</a>
            <a class="nav-item" data-view="api" id="navApi"><span class="ico">⌁</span> API & Protocols</a>
        </nav>
    </aside>

    <main class="content">
        <div id="banner" class="banner hidden"></div>

        <!-- DASHBOARD -->
        <section id="dashboardView">
            <div class="page-head">
                <div>
                    <h1 id="dashTitle">Dashboard</h1>
                    <p class="muted" id="dashSub"></p>
                </div>
            </div>
            <div class="stats" id="statCards"></div>
            <h2 class="section-h">Data Models</h2>
            <div class="card-grid" id="entityCards"></div>
            <h2 class="section-h">Flows</h2>
            <div class="card-grid" id="flowCards"></div>
        </section>

        <!-- ENTITY DATA BROWSER -->
        <section id="entityView" class="hidden">
            <div class="page-head">
                <h1 id="entityTitle"></h1>
                <div class="actions">
                    <input id="searchValue" class="search" placeholder="Search…"/>
                    <select id="searchField" class="search-field"></select>
                    <button id="searchBtn" class="btn">Search</button>
                    <button id="newBtn" class="btn primary">+ New</button>
                </div>
            </div>
            <div class="table-wrap">
                <table id="dataTable"><thead></thead><tbody></tbody></table>
            </div>
            <div class="pager">
                <button id="prevBtn" class="btn small">‹ Prev</button>
                <span id="pageInfo" class="muted"></span>
                <button id="nextBtn" class="btn small">Next ›</button>
            </div>
        </section>

        <!-- FLOWS -->
        <section id="flowsView" class="hidden">
            <div class="page-head"><h1>Flows</h1><p class="muted">Run a no-code flow with a JSON input.</p></div>
            <div class="card-grid" id="flowRunCards"></div>
        </section>

        <!-- API -->
        <section id="apiView" class="hidden">
            <div class="page-head"><h1>API & Protocols</h1></div>
            <div class="card-grid" id="protocolCards"></div>
            <h2 class="section-h">Custom Endpoints</h2>
            <div class="card-grid" id="endpointCards"></div>
        </section>
    </main>
</div>

<!-- Record editor modal -->
<div id="modal" class="modal hidden">
    <div class="modal-card">
        <div class="modal-head"><h3 id="modalTitle"></h3><button id="modalClose" class="x">×</button></div>
        <form id="recordForm" class="form"></form>
        <div id="formError" class="form-error hidden"></div>
        <div class="modal-foot">
            <button id="cancelBtn" class="btn">Cancel</button>
            <button id="saveBtn" class="btn primary">Save</button>
        </div>
    </div>
</div>

<!-- Flow run modal -->
<div id="flowModal" class="modal hidden">
    <div class="modal-card">
        <div class="modal-head"><h3 id="flowModalTitle"></h3><button id="flowModalClose" class="x">×</button></div>
        <div class="form">
            <label>Input (JSON)
                <textarea id="flowInput" rows="4">{}</textarea></label>
            <div class="muted" style="font-size:12px">Output</div>
            <pre id="flowOutput" class="output">—</pre>
        </div>
        <div class="modal-foot">
            <button id="flowCancelBtn" class="btn">Close</button>
            <button id="flowRunBtn" class="btn primary">Run flow</button>
        </div>
    </div>
</div>

<!-- Login modal -->
<div id="loginModal" class="modal hidden">
    <div class="modal-card small">
        <div class="modal-head"><h3>Sign in</h3></div>
        <form id="loginForm" class="form">
            <label>Username<input id="loginUser" required/></label>
            <label>Password<input id="loginPass" type="password" required/></label>
        </form>
        <div id="loginError" class="form-error hidden"></div>
        <div class="modal-foot"><button id="loginBtn" class="btn primary">Sign in</button></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
