# ---------------------------------------------------------------------------
# FlexForge config bundle — the single source of truth for this application.
# The engine interprets this at runtime. There is no generated source code.
# This bundled sample uses in-memory H2 so the engine runs with zero setup.
# ---------------------------------------------------------------------------
appId: crm-demo
configVersion: "0.1.0"
engineVersion: "0.1.x"

database:
  # engine/url/credentials may be ${ENV} placeholders. With nothing set, the engine
  # falls back to in-memory H2 — see EngineConfiguration#dataSource.
  engine: ${DB_ENGINE}
  url: ${DB_URL}
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}
  pool:
    maxSize: 15
    minIdle: 7
    maxLifetimeMs: 1680000

api:
  rest:
    enabled: true
    basePath: /api
  graphql:
    enabled: true
    path: /graphql

entities:
  - name: Customer
    idStrategy: IDENTITY
    fields:
      - { name: id,        type: LONG,    pk: true }
      - { name: email,     type: STRING,  length: 255, unique: true, nullable: false, email: true }
      - { name: fullName,  type: STRING,  length: 200, minLength: 2 }
      - { name: tier,      type: STRING,  length: 30 }
      - { name: active,    type: BOOLEAN }
      - { name: profile,   type: JSON }
      - { name: ssn,       type: TEXT,    encrypted: true }   # stored AES-256-GCM encrypted
      - { name: createdAt, type: TIMESTAMP }

  - name: Product
    idStrategy: IDENTITY
    fields:
      - { name: id,        type: LONG,    pk: true }
      - { name: sku,       type: STRING,  length: 64, unique: true, nullable: false }
      - { name: name,      type: STRING,  length: 200, nullable: false }
      - { name: price,     type: DECIMAL, min: 0 }
      - { name: inStock,   type: BOOLEAN }

  # An Order links to a Customer (REFERENCE) and auto-manages its timestamps.
  - name: Order
    idStrategy: IDENTITY
    fields:
      - { name: id,         type: LONG,      pk: true }
      - { name: customerId, type: REFERENCE, references: Customer, nullable: false }
      - { name: total,      type: DECIMAL,   min: 0 }
      - { name: status,     type: STRING,    length: 30 }
      - { name: createdAt,  type: TIMESTAMP }
      - { name: updatedAt,  type: TIMESTAMP }

  # Stores an uploaded file/image/document via the file API.
  - name: Document
    idStrategy: IDENTITY
    fields:
      - { name: id,         type: LONG,   pk: true }
      - { name: title,      type: STRING, length: 200 }
      - { name: attachment, type: FILE }

security:
  enabled: false              # demo is open; flip to true + add users/rules to lock it
  encryptionKey: ${ENCRYPTION_KEY}   # falls back to a dev key if unset

migrationPolicy:
  additive: auto
  destructive: require_approval
  pattern: expand_contract
  backupBeforeApply: true
