# ---------------------------------------------------------------------------
# FlexForge config bundle — the single source of truth for this application.
# The engine interprets this at runtime. There is no generated source code.
# This bundled sample uses in-memory H2 so the engine runs with zero setup.
# ---------------------------------------------------------------------------
appId: crm-demo
configVersion: "0.1.0"
engineVersion: "0.1.x"

database:
  # engine/url/credentials may be ${ENV} placeholders. With nothing set, the engine
  # falls back to in-memory H2 — see EngineConfiguration#dataSource.
  engine: ${DB_ENGINE}
  url: ${DB_URL}
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}
  pool:
    maxSize: 15
    minIdle: 7
    maxLifetimeMs: 1680000

api:
  rest:
    enabled: true
    basePath: /api
  graphql:
    enabled: true
    path: /graphql

entities:
  - name: Customer
    idStrategy: IDENTITY
    fields:
      - { name: id,        type: LONG,    pk: true }
      - { name: email,     type: STRING,  length: 255, unique: true, nullable: false, email: true }
      - { name: fullName,  type: STRING,  length: 200, minLength: 2 }
      - { name: tier,      type: SELECT,  options: [gold, silver, bronze, platinum] }
      - { name: channels,  type: MULTISELECT, options: [email, sms, push, whatsapp] }
      - { name: active,    type: BOOLEAN }
      - { name: profile,   type: JSON }
      - { name: ssn,       type: TEXT,    encrypted: true }   # stored AES-256-GCM encrypted
      - { name: label,     type: FORMULA, formula: "${tier} · ${fullName}" }   # computed on read
      - { name: createdAt, type: TIMESTAMP }

  - name: Product
    idStrategy: IDENTITY
    fields:
      - { name: id,        type: LONG,    pk: true }
      - { name: sku,       type: STRING,  length: 64, unique: true, nullable: false }
      - { name: name,      type: STRING,  length: 200, nullable: false }
      - { name: price,     type: DECIMAL, min: 0 }
      - { name: inStock,   type: BOOLEAN }

  # An Order links to a Customer (REFERENCE) and auto-manages its timestamps.
  - name: Order
    idStrategy: IDENTITY
    fields:
      - { name: id,         type: LONG,      pk: true }
      - { name: customerId, type: REFERENCE, references: Customer, nullable: false }
      - { name: total,      type: DECIMAL,   min: 0 }
      - { name: status,     type: STRING,    length: 30 }
      - { name: createdAt,  type: TIMESTAMP }
      - { name: updatedAt,  type: TIMESTAMP }

  # Stores an uploaded file/image/document via the file API.
  - name: Document
    idStrategy: IDENTITY
    fields:
      - { name: id,         type: LONG,   pk: true }
      - { name: title,      type: STRING, length: 200 }
      - { name: attachment, type: FILE }

security:
  enabled: false              # demo is open; flip to true + add users/rules to lock it
  encryptionKey: ${ENCRYPTION_KEY}   # falls back to a dev key if unset

# Custom flow endpoints (no code) — method + required headers/params + an action.
endpoints:
  - name: ping
    method: GET
    requiredParams: [who]
    action:
      type: json
      body: { message: "pong" }
  - name: docs
    method: GET
    action:
      type: redirect
      url: /__meta/openapi.json
  - name: notify
    method: POST
    requiredHeaders: [X-API-Key]
    action:
      type: json
      body: { accepted: true }

# No-code flows: trigger via POST /flows/{name}/run
flows:
  - name: greet
    steps:
      - id: reply
        type: respond
        params:
          body: { message: "Hello ${input.name}" }

  - name: signup            # create a Customer through a flow, then respond
    steps:
      - id: create
        type: db
        params:
          op: create
          entity: Customer
          data: { email: "${input.email}", fullName: "${input.fullName}" }
        next: done
      - id: done
        type: respond
        params:
          body: { id: "${steps.create.id}", email: "${steps.create.email}" }

  - name: grade             # branch on a numeric condition
    steps:
      - id: check
        type: condition
        params: { left: "${input.score}", op: ">=", right: 50 }
        then: pass
        else: fail
      - id: pass
        type: respond
        params: { body: { result: "pass" } }
      - id: fail
        type: respond
        params: { body: { result: "fail" } }

  - name: toolbox          # standard-library steps: math + string + crypto
    steps:
      - id: sum
        type: math
        params: { op: add, a: "${input.x}", b: "${input.y}" }
        next: upper
      - id: upper
        type: string
        params: { op: upper, value: "${input.name}" }
        next: id
      - id: id
        type: crypto
        params: { op: uuid }
        next: done
      - id: done
        type: respond
        params: { body: { sum: "${steps.sum.result}", name: "${steps.upper.result}", id: "${steps.id.result}" } }

  - name: double           # sub-flow target: doubles input.item
    steps:
      - id: calc
        type: math
        params: { op: multiply, a: "${input.item}", b: 2 }
        next: out
      - id: out
        type: respond
        params: { body: { value: "${steps.calc.result}" } }

  - name: batch            # loop: run 'double' for each number
    steps:
      - id: loop
        type: loop
        params: { items: "${input.numbers}", flow: double }
        next: done
      - id: done
        type: respond
        params: { body: { count: "${steps.loop.count}", results: "${steps.loop.results}" } }

  - name: route            # switch: multi-way branch on input.kind
    steps:
      - id: sw
        type: switch
        params: { value: "${input.kind}", cases: { a: stepA, b: stepB }, default: stepDefault }
      - id: stepA
        type: respond
        params: { body: { path: "A" } }
      - id: stepB
        type: respond
        params: { body: { path: "B" } }
      - id: stepDefault
        type: respond
        params: { body: { path: "default" } }

  - name: onNewOrder       # record-change trigger: runs when an Order is created
    trigger: { type: record, entity: Order, on: [create] }
    steps:
      - id: alert
        type: notify
        params: { channel: log, subject: "New order", message: "Order ${input.id} created" }
        next: done
      - id: done
        type: respond
        params: { body: { handled: true } }

  - name: assist            # AI step + notification (AI runs in stub mode w/o a key)
    steps:
      - id: think
        type: ai
        params: { prompt: "Summarize: ${input.text}" }
        next: tell
      - id: tell
        type: notify
        params: { channel: log, to: "${input.email}", subject: "Summary", message: "${steps.think.text}" }
        next: done
      - id: done
        type: respond
        params: { body: { summary: "${steps.think.text}" } }

# AI provider (stub by default; set apiKey to use a real OpenAI-compatible endpoint)
ai:
  provider: stub
  apiKey: ${AI_API_KEY}
  model: gpt-4o-mini

migrationPolicy:
  additive: auto
  destructive: require_approval
  pattern: expand_contract
  backupBeforeApply: true
